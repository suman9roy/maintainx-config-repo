server:
  port: ${SERVER_PORT:8090}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maintainx_ai}
    username: ${DB_USERNAME:maintainx}
    password: ${DB_PASSWORD:maintainx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_MODEL_NAME:qwen2:1.7b}
        options:
          temperature: 0.7
          top-p: 0.9
      embedding:
        model: ${SPRING_AI_OLLAMA_EMBEDDING_MODEL_NAME:nomic-embed-text}
    

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true


maintainx:
  ai-platform:
    guardrails:
      enabled: true
      allowed-domain: apartment-management

logging:
  level:
    root: INFO
    com.maintainx.aiplatform: DEBUG
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: docker
